---
name: Publish to PyPI

'on':
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The eval-corpus integrity tests read git history (manifests pin commit
          # oids); a shallow checkout fails them, same as ci.yml's test job.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify release tag matches project version
        run: |
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag must be v$version, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      # The release ref must prove itself: CI gates main, not tags.
      - run: python -m pip install -e ".[dev]" build
      # Same pinned linter as ci.yml — an unpinned ruff here once failed a
      # release with rules the CI gate doesn't enforce.
      - run: python -m pip install ruff==0.14.0
      - run: ruff check .
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): PyPI trusts this repo+workflow+environment,
    # no API token exists anywhere. Setup steps in RELEASING.md.
    environment:
      name: pypi
      url: https://pypi.org/p/rocket-review
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
