---
name: Publish to PyPI

'on':
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release tag matches project version
        run: |
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag must be v$version, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      # The release ref must prove itself: CI gates main, not tags.
      - run: python -m pip install -e ".[dev]" build
      - run: ruff check .
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): PyPI trusts this repo+workflow+environment,
    # no API token exists anywhere. Setup steps in RELEASING.md.
    environment:
      name: pypi
      url: https://pypi.org/p/rocket-review
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
