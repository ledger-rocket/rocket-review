---
name: Publish to PyPI

'on':
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # First, so a tag that disagrees with the project version, or a lint failure, fails
  # before the test matrix runs, and is reported even when a test leg would fail.
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify release tag matches project version
        run: |
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag must be v$version, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      # Same pinned linter as ci.yml — an unpinned ruff here once failed a
      # release with rules the CI gate doesn't enforce.
      - run: python -m pip install ruff==0.14.0
      - run: ruff check .

  # The release ref must prove itself: CI gates main, not tags. A release ships its
  # classifiers, so the tag passes the suite on every Python they name
  # (tests/test_python_versions.py keeps this matrix equal to them).
  test:
    needs: verify-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The eval-corpus integrity tests read git history (manifests pin commit
          # oids); a shallow checkout fails them, same as ci.yml's test job.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): PyPI trusts this repo+workflow+environment,
    # no API token exists anywhere. Setup steps in RELEASING.md.
    environment:
      name: pypi
      url: https://pypi.org/p/rocket-review
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
