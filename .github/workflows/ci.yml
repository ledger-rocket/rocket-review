---
name: CI

# Self-contained CI: every gate runs on public, SHA-pinned actions with no
# secrets and `contents: read` only — safe to run on fork PRs.
#
# Gates: ruff (lint), mypy (type-check), pytest (unit suite), package build +
# import smoke, yamllint, and a pip-audit dependency vulnerability scan.
#
# The `CI Success` aggregator is the single required status check in the
# branch ruleset, so gates can be added or removed above without a ruleset
# edit.

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Ruff lint
        run: uvx ruff@0.14.0 check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Mypy type-check
        run: uvx --with openai mypy@1.18.2 rocket_review/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The eval corpus pins each case to a commit oid and its manifest-integrity
          # tests read that commit out of the object database (`git show <oid>:<path>`,
          # ancestry against main). The default depth-1 checkout has none of it. The
          # repo is small, so full history is cheaper than teaching the tests to skip.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Run test suite
        run: |
          uv venv
          uv pip install -e ".[dev]"
          .venv/bin/pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Build package
        run: uv build
      - name: Import smoke test
        run: |
          uv venv
          uv pip install dist/*.whl
          .venv/bin/python -c \
            "import rocket_review.cli, rocket_review.models, rocket_review.prompts, rocket_review.backends"

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Yamllint
        run: uvx yamllint@1.37.1 .

  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      # `dependencies` is empty and there is no lockfile, so there is no pinned
      # set on disk to audit — it has to be resolved first. `[dev]` is the widest
      # target: it pulls in `[api]`, so every package a user can install is
      # covered, plus the linters that run here as CI-executed code. A dev-only
      # advisory blocking a PR is the intended trade; `--ignore-vuln ID` is the
      # release valve if one ever lands with no fix available.
      #
      # Resolving instead of reading a lockfile means the audit set tracks what
      # PyPI would give a user today, not what was pinned months ago. The cost is
      # that an upstream release can turn this red on a PR that changed nothing —
      # correct for a security gate, and the reason it is a separate job rather
      # than a step bolted onto `test`, where a red pytest would hide it and a
      # CVE would report as a test failure.
      - name: Resolve the dev install set
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip freeze --exclude-editable > "${RUNNER_TEMP}/audit-requirements.txt"
      # pip-audit comes straight from PyPI rather than through a wrapper action.
      # The wrapper runs this same command underneath, `uvx <tool>@<version>` is
      # how every other gate in this file pins its tooling, and it keeps the
      # third-party action count of a fork-PR-safe workflow at zero.
      #
      # -s osv queries the OSV database, which covers advisories PyPI's own
      # service does not. --no-deps audits the literal pins from the freeze
      # instead of re-resolving. --strict exits non-zero on a scan error, not
      # just on a finding, so a broken audit cannot pass as a clean one.
      - name: Audit for known vulnerabilities
        run: >-
          uvx pip-audit@2.10.1 --strict --no-deps -s osv
          --requirement "${RUNNER_TEMP}/audit-requirements.txt"

  # Single green/red target for branch protection. The ruleset requires only
  # this check by name. Every gate above runs unconditionally, so a `skipped`
  # result is never expected — it means the run was cancelled or a gate was
  # disabled, and it fails the aggregator.
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs: [lint, typecheck, test, build, yaml-lint, vuln-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to have passed
        run: |
          set -euo pipefail
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::a required CI gate failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::a required CI gate was cancelled."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "::error::a required CI gate was unexpectedly skipped."
            exit 1
          fi
          echo "All required CI gates passed."
