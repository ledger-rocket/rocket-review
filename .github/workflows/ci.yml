---
name: CI

# Self-contained CI for the public rocket-review repo. Public repos cannot call
# internal `.github-private` reusables (GitHub blocks internal->public reuse), so
# every gate here runs on public, SHA-pinned actions with no secrets and
# `contents: read` only — safe to run on fork PRs. Replaces the old minimal-ci.yml,
# which composed internal reusables and leaked internal workflow paths.
#
# Gates: ruff (lint), mypy (type-check), package build + import smoke, and yamllint.
# There is no unit-test suite yet — the `test` job builds the package and imports
# every module to catch packaging/import breakage. A pytest suite is the follow-up
# (PRO-3312).
#
# The `CI Success` aggregator is the single required status check (tier=standard),
# so gates can be added or removed above without a ruleset edit.

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - name: Ruff lint
        run: uvx ruff@0.14.0 check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - name: Mypy type-check
        run: uvx --with openai mypy@1.18.2 rocket_review/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - name: Build package
        run: uv build
      - name: Import smoke test
        run: |
          uv venv
          uv pip install -e .
          .venv/bin/python -c "import rocket_review.cli, rocket_review.review, rocket_review.prompts"

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - name: Yamllint
        run: uvx yamllint@1.37.1 .

  # Single green/red target for branch protection. The standard-tier ruleset
  # requires only this check by name. Every gate above runs unconditionally, so a
  # `skipped` result is never expected — it means the run was cancelled or a gate
  # was disabled, and it fails the aggregator.
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs: [lint, typecheck, test, yaml-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to have passed
        run: |
          set -euo pipefail
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::a required CI gate failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::a required CI gate was cancelled."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "::error::a required CI gate was unexpectedly skipped."
            exit 1
          fi
          echo "All required CI gates passed."
