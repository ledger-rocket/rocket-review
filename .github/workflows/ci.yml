---
name: CI

# Self-contained CI: every gate runs on public, SHA-pinned actions with no
# secrets and `contents: read` only — safe to run on fork PRs.
#
# Gates: ruff (lint), mypy (type-check), pytest (unit suite), package build +
# import smoke, yamllint, and a pip-audit dependency vulnerability scan.
#
# Each job runs one step of scripts/check, which holds the commands and the
# tool pins. `just preflight` runs the same script with no argument, so a
# local preflight and this workflow run the same commands.
#
# The `CI Success` aggregator is the single required status check in the
# branch ruleset, so gates can be added or removed above without a ruleset
# edit.

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - name: Ruff lint
        run: scripts/check lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - name: Mypy type-check
        run: scripts/check types

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          # The eval corpus pins each case to a commit oid and its manifest-integrity
          # tests read that commit out of the object database (`git show <oid>:<path>`,
          # ancestry against main). The default depth-1 checkout has none of it. The
          # repo is small, so full history is cheaper than teaching the tests to skip.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - name: Run test suite
        run: scripts/check test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - name: Build package and import smoke test
        run: scripts/check build

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - name: Yamllint
        run: scripts/check yaml

  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      # The audit is a separate job rather than a step bolted onto `test`: a red
      # pytest would hide it, and a CVE would report as a test failure.
      # scripts/check says why the set is resolved, not read from a lockfile.
      - name: Audit for known vulnerabilities
        run: scripts/check audit

  # Single green/red target for branch protection. The ruleset requires only
  # this check by name. Every gate above runs unconditionally, so a `skipped`
  # result is never expected — it means the run was cancelled or a gate was
  # disabled, and it fails the aggregator.
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs: [lint, typecheck, test, build, yaml-lint, vuln-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to have passed
        run: |
          set -euo pipefail
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::a required CI gate failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::a required CI gate was cancelled."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "::error::a required CI gate was unexpectedly skipped."
            exit 1
          fi
          echo "All required CI gates passed."
