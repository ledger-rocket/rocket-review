# One guard lifted out of a run of four sibling argument checks, so the block still reads
# as complete. The removal is silent rather than loud: --fail-on keeps working, it just
# never has anything to gate on. A deleted guard has no lines of its own, so the span is
# where it belonged — and it starts at the strongest evidence rather than at the deletion.
# --fail-on's own help text at cli.py:429 still promises "(requires --json)", which is the
# line a repo-navigating backend is most likely to quote when it notices nothing enforces
# that promise; citing it is having the defect right, so the span covers it through to the
# sibling check the deleted guard sat beside. Rule 3's human read is what still separates
# that from a finding that merely lands in the same region.
id: b-017
mode: diff
source: mutant
diff: cases/b-017.patch
repo_commit: c4fd306b4312f3c915766709a3468fbd13f0fc40
defect:
  class: dropped-guard
  file: rocket_review/cli.py
  span: [429, 440]
  expected: >-
    --fail-on is accepted without --json. Prose results carry no parsed findings, so
    should_fail sees nothing to trip on and `rr --diff --fail-on critical` exits 0 on
    every review — a CI gate written that way passes everything.
# Admission proof: these tests pass at repo_commit and fail with `diff` applied.
# Written by `python evals/verify_cases.py --write`; re-run it rather than editing.
killed_by:
