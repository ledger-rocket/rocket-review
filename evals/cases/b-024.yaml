defect:
  class: swallowed-error
  file: rocket_review/cli.py
  span: [793, 798]
  expected: >-
    A ConfigError is caught and the run proceeds on built-in defaults instead of exiting 1,
    so a project or user config rr refuses — an unknown key, a malformed value, invalid
    TOML — is discarded without a word: every setting the file supplied stops applying, and
    a CI gate that lived in .rocket-review.toml exits 0 on every review from then on.
