# The same call is retried with no layers at all, which is what makes the swallow silent:
# resolve() succeeds against the built-in defaults, so nothing downstream can tell that a
# config file was read and refused. The span starts at the `try` rather than the handler,
# because the two lines the handler now runs are only wrong in the light of the two above
# them — a reviewer who has this right may cite either.
