# The timeout path tears the process group down but returns an empty string instead of
# raising. Every CLI backend re-detects the emptiness a layer down, so what the mutation
# actually costs is the diagnosis — and, on codex, the detection too.
id: b-008
mode: diff
source: mutant
diff: cases/b-008.patch
repo_commit: 88e691a8ef687535c14c374ec3f353c08ed01b7b
defect:
  class: swallowed-error
  file: rocket_review/backends/base.py
  span: [129, 129]
  expected: >-
    A backend that outlives its timeout gets "" back instead of a BackendError, so the
    timeout is never named: claude and opencode re-detect the empty string and fail with
    "produced no output", losing the cause and the elapsed budget. codex discards the
    return value and reads its output file instead, so it reports the same — unless the
    killed process had already written part of that file, in which case the fragment is
    returned as a complete review.
# Admission proof: these tests pass at repo_commit and fail with `diff` applied.
# Written by `python evals/verify_cases.py --write`; re-run it rather than editing.
killed_by:
  - tests/test_backends.py::test_run_command_timeout_message_uses_seconds_when_not_whole_minutes
  - tests/test_backends.py::test_run_command_timeout_message_uses_minutes_for_whole_minutes
  - tests/test_backends.py::test_run_command_timeout_kills_process_group
