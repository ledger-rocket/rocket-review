[build-system]
requires = ["setuptools>=78.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-review"
version = "0.1.0"
description = "Second-opinion code and plan reviews from Codex, Claude Code, opencode, or the OpenAI API — one CLI"
requires-python = ">=3.13"
license = "Apache-2.0"
readme = "README.md"
keywords = ["code-review", "llm", "ai", "cli", "developer-tools"]
classifiers = ["Development Status :: 4 - Beta"]
# Base install stays light: the CLI backends (codex/claude/opencode) shell out to
# their own tools. Only the `api` backend needs the OpenAI SDK — see the [api] extra.
dependencies = []

[project.urls]
Repository = "https://github.com/ledger-rocket/rocket-review"
Issues = "https://github.com/ledger-rocket/rocket-review/issues"

[project.scripts]
rr = "rocket_review.cli:main"

[project.optional-dependencies]
api = ["openai>=1.68"]
# dev pulls in [api] so the api backend's tests run; single source for the openai pin.
dev = ["pytest>=8", "ruff>=0.6", "rocket-review[api]"]

[tool.ruff]
line-length = 100
target-version = "py313"
