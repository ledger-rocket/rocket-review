[build-system]
requires = ["setuptools>=78.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-review"
version = "0.1.1"
description = "Second-opinion code and plan reviews from Codex, Claude Code, opencode, or the OpenAI API — one CLI"
requires-python = ">=3.13"
# Compound expression: the review prompts carry finding-classification wording derived
# from GSD, which is MIT. THIRD_PARTY_NOTICES.md names the passage.
license = "Apache-2.0 AND MIT"
# THIRD_PARTY_NOTICES.md rides along here because license-files is the only hook that
# puts a top-level file into both the sdist and the wheel. Naming any file replaces the
# default glob set, so LICENSE has to be listed explicitly too.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
keywords = ["code-review", "llm", "ai", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# Base install stays light: the CLI backends (codex/claude/opencode) shell out to
# their own tools. Only the `api` backend needs the OpenAI SDK — see the [api] extra.
dependencies = []

[project.urls]
Repository = "https://github.com/ledger-rocket/rocket-review"
Issues = "https://github.com/ledger-rocket/rocket-review/issues"

[project.scripts]
rr = "rocket_review.cli:main"

[project.optional-dependencies]
api = ["openai>=1.68"]
# dev pulls in [api] so the api backend's tests run; single source for the openai pin.
# jsonschema is for evals/ only — the runtime parser is intentionally lenient and
# validates nothing strictly, so it must not become an install-time dependency.
dev = [
    "pytest>=8", "ruff>=0.6", "mypy>=1.18", "yamllint>=1.37",
    "jsonschema>=4", "rocket-review[api]",
]

# Pin what ships. Flat-layout auto-discovery treats every top-level directory as a
# candidate package, so evals/ (developer tooling, never installed) would otherwise
# both land in the wheel and make the build ambiguous.
[tool.setuptools.packages.find]
include = ["rocket_review*"]

[tool.ruff]
line-length = 100
target-version = "py313"
